name: Deploy site

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Full lowercase commit SHA from main to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cueson-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      REVISION: ${{ inputs.revision }}
      CLOUDFLARE_ACCOUNT_ID: 39e3052d61e3edccea7d68269ec07182
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate requested main revision
        shell: bash
        run: |
          if ! [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full lowercase Git SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - name: Bind checkout to main
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          git fetch origin main
          git merge-base --is-ancestor "$REVISION" origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: site
      - run: corepack pnpm exec playwright install --with-deps chromium
        working-directory: site
      - run: corepack pnpm test
        working-directory: site
        env:
          CUESON_SOURCE_COMMIT: ${{ inputs.revision }}
      - name: Deploy exact verified artifact
        run: corepack pnpm exec wrangler deploy
        working-directory: site
