name: Release proof

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-proof-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_COMPAT_VERSION: 1.25.x
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  release-proof:
    name: Non-publishing candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_COMPAT_VERSION }}
          cache-dependency-path: |
            go.sum
            scripts/release-verify/go.mod
      - name: Install exact release tools
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/release-tools
          GOTOOLCHAIN: auto
        run: |
          mkdir -p "${GOBIN}"
          go install github.com/goreleaser/goreleaser/v2@v2.18.1
          go install github.com/anchore/syft/cmd/syft@v1.51.1
          printf '%s\n' "${GOBIN}" >> "${GITHUB_PATH}"
      - name: Validate release configuration
        run: goreleaser check
      - name: Build non-publishing candidate
        run: goreleaser release --snapshot --clean --skip=publish
      - name: Verify release candidate
        shell: bash
        run: |
          source_commit="$(git rev-parse HEAD)"
          go -C scripts/release-verify run . -dist ../../dist -repo ../.. -version 1.0.0 -commit "${source_commit}"
      - name: Retain accepted candidate bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cueson-1.0.0-candidate-${{ env.SOURCE_COMMIT }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  native-smoke:
    name: Packaged smoke (${{ matrix.platform }})
    needs: release-proof
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux amd64
            target: linux-amd64
            runner: ubuntu-24.04
          - platform: Windows amd64
            target: windows-amd64
            runner: windows-2025
          - platform: macOS amd64
            target: darwin-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_COMPAT_VERSION }}
          cache-dependency-path: scripts/release-verify/go.mod
      - name: Download accepted candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cueson-1.0.0-candidate-${{ env.SOURCE_COMMIT }}
          path: dist/
      - name: Verify accepted bundle and execute native binary
        run: go -C scripts/release-verify run . -dist ../../dist -repo ../.. -version 1.0.0 -commit "${{ env.SOURCE_COMMIT }}" -execute-host -evidence "${{ runner.temp }}/release-evidence-${{ matrix.target }}.json"
      - name: Retain native smoke evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cueson-1.0.0-native-smoke-${{ matrix.target }}-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/release-evidence-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 3
