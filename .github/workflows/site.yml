name: Site

on:
  pull_request:
    paths:
      - ".github/workflows/site*.yml"
      - ".gitattributes"
      - ".gitignore"
      - "brand/**"
      - "docs/**"
      - "schema/**"
      - "site/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "SECURITY.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/site*.yml"
      - ".gitattributes"
      - ".gitignore"
      - "brand/**"
      - "docs/**"
      - "schema/**"
      - "site/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "SECURITY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: site
      - run: corepack pnpm exec playwright install --with-deps chromium
        working-directory: site
      - run: corepack pnpm test
        working-directory: site
