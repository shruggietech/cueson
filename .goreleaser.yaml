version: 2

project_name: cueson
dist: dist

snapshot:
  version_template: "1.0.0"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: cueson
    main: ./cmd/cueson
    binary: cueson
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0
    flags:
      - -trimpath
      - -buildvcs=true
    ldflags:
      - -s -w -X github.com/shruggietech/cueson/internal/version.releaseOverride=cueson-release-version:{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cueson-archives
    ids:
      - cueson
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "cueson_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
          mode: 0644
      - src: NOTICE
        info:
          mtime: "{{ .CommitDate }}"
          mode: 0644
      - src: schema/releases/v1.0.0/cueson.schema.json
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"
          mode: 0644

checksum:
  name_template: "cueson_{{ .Version }}_checksums.txt"
  algorithm: sha256
  split: false
  ids:
    - cueson-archives

sboms:
  - id: cueson-sboms
    ids:
      - cueson
    artifacts: binary
    env:
      - SYFT_FILE_METADATA_SELECTION=none
    documents:
      - "cueson_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if eq .Os \"windows\" }}.zip{{ else }}.tar.gz{{ end }}.sbom.json"
    cmd: syft
    args:
      - "$artifact"
      - --source-name
      - "cueson_{{ .Os }}_{{ .Arch }}"
      - --source-version
      - "{{ .Version }}+{{ .FullCommit }}"
      - --output
      - "spdx-json=$document"

release:
  disable: true
